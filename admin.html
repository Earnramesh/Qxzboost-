<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin | CreatorConnect</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">Admin Panel</div>
        <button class="btn btn-outline logout-btn">Logout</button>
    </nav>
    <div style="padding: 40px 5%;">
        <h2>Pending Creators</h2>
        <div class="glass-card" style="margin-top: 20px; overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Followers</th>
                        <th>Category</th>
                        <th>Screenshot</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr><td colspan="5">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script type="module" src="js/admin.js"></script>
</body>
</html>
