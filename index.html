<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  Qxzboost — Connect Creators With Brands</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-blobs"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    
    <nav>
        <div class="logo"> Qxz Boost</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#how-it-works">How It Works</a>
            <button class="btn btn-outline login-btn">Login</button>
        </div>
    </nav>

    <header class="grid-2">
        <div>
            <h1 style="font-size: 3.5rem; line-height: 1.2; margin-bottom: 20px;">Where Creators <br><span style="background: var(--gradient); -webkit-background-clip: text; color: transparent;">Meet Brands.</span></h1>
            <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 32px;">Discover sponsorship opportunities, showcase your audience, and connect with brands looking for creators like you.</p>
            <div style="display: flex; gap: 16px;">
                <button class="btn btn-primary login-btn">I'm a Creator</button>
                <button class="btn btn-outline login-btn">I'm a Brand</button>
            </div>
        </div>
        <div class="glass-card" style="position: relative; height: 400px;">
            <!-- UI Mockup Visual -->
            <div style="padding: 16px; border-bottom: 1px solid var(--glass-border);">Sponsorships Available</div>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
                <div style="height: 60px; background: rgba(255,255,255,0.05); border-radius: 8px;"></div>
                <div style="height: 60px; background: rgba(255,255,255,0.05); border-radius: 8px;"></div>
                <div style="height: 60px; background: rgba(255,255,255,0.05); border-radius: 8px;"></div>
            </div>
        </div>
    </header>

    <!-- Role Selection Modal -->
    <div class="modal" id="roleModal">
        <div class="modal-content glass-card">
            <h2 style="margin-bottom: 24px;">What are you?</h2>
            <div style="display: flex; flex-direction: column; gap: 16px;">
                <button class="btn btn-primary role-select-btn" data-role="creator">I am a Creator</button>
                <button class="btn btn-outline role-select-btn" data-role="brand">I am a Brand</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
